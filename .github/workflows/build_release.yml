name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
          python -m pip list

      - name: Run test suite
        run: |
          python -m unittest discover -s tests

      - name: Build standalone executable
        run: |
          python build_exe.py

      - name: Generate SHA-256 Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/BraviaTheatrePC.exe -Algorithm SHA256).Hash
          Set-Content -Path "dist/BraviaTheatrePC.exe.sha256" -Value "$hash  BraviaTheatrePC.exe"
          Write-Host "BraviaTheatrePC.exe SHA256: $hash"

      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: BRAVIA Theatre PC ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/BraviaTheatrePC.exe
            dist/BraviaTheatrePC.exe.sha256
