name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "codex/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseding a branch or pull-request run saves nothing that matters, but main's
  # run is the record of whether a released commit was verified, so let it finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for committed credentials
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # v8.30.1 has a confirmed default-rule regression; keep the last
          # known-good scanner until an upstream fixed release is available.
          GITLEAKS_VERSION: 8.29.0

  build-test:
    name: Build, test, and publish smoke test
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302

      - name: Restore dependencies
        run: dotnet restore BraviaTheatrePC.sln

      - name: Verify formatting
        run: dotnet format BraviaTheatrePC.sln --verify-no-changes --no-restore

      - name: Build Release
        run: dotnet build BraviaTheatrePC.sln -c Release --no-restore -warnaserror

      - name: Run tests
        run: dotnet test BraviaTheatrePC.sln -c Release --no-build --collect:"XPlat Code Coverage"

      - name: Audit NuGet packages
        shell: pwsh
        run: |
          # The command exits 0 even when it reports vulnerable packages, so the
          # result has to be read from its JSON report for the step to fail.
          $report = dotnet package list --project BraviaTheatrePC.sln --vulnerable --include-transitive --format json
          if ($LASTEXITCODE -ne 0) { throw "NuGet vulnerability audit could not run (exit code $LASTEXITCODE)." }

          $report = $report -join "`n"
          Write-Output $report

          $vulnerable = @(
            ($report | ConvertFrom-Json).projects |
              ForEach-Object { $_.frameworks } |
              ForEach-Object { @($_.topLevelPackages) + @($_.transitivePackages) } |
              Where-Object { $_ -and $_.vulnerabilities }
          )
          if ($vulnerable.Count -gt 0) {
            $names = ($vulnerable | ForEach-Object { "$($_.id) $($_.resolvedVersion)" } | Sort-Object -Unique) -join ", "
            throw "Vulnerable NuGet packages found: $names"
          }

      # Restore and publish exactly as release.yml does. A publish that restores on its own hid a
      # release that could not publish with --no-restore (NETSDK1094).
      - name: Restore for publishing
        run: dotnet restore BraviaTheatrePC.sln -r win-x64

      - name: Smoke-test standalone publish
        run: dotnet publish src/BraviaTheatre.UI/BraviaTheatre.UI.csproj -c Release -r win-x64 --self-contained --no-restore -p:PublishSingleFile=true -p:DebugType=none -o artifacts/standalone

      - name: Smoke-test framework-dependent publish
        run: dotnet publish src/BraviaTheatre.UI/BraviaTheatre.UI.csproj -c Release -r win-x64 --no-self-contained --no-restore -p:PublishSingleFile=true -p:DebugType=none -o artifacts/framework-dependent

      - name: Verify publish outputs
        shell: pwsh
        run: |
          # The release ships only the executable, so anything published beside it would be
          # missing on users' machines.
          foreach ($variant in "standalone", "framework-dependent") {
            $files = @(Get-ChildItem -LiteralPath "artifacts/$variant" -Recurse -File | ForEach-Object { $_.Name })
            if ($files.Count -ne 1 -or $files[0] -ne "BraviaTheatrePC.exe") {
              throw "The $variant publish must contain only BraviaTheatrePC.exe; found: $($files -join ', ')."
            }
          }

      - name: Smoke-test that both executables start
        shell: pwsh
        run: |
          # A publish that succeeds proves nothing about startup: the framework-dependent build
          # failed fast inside the runtime before Main for several releases. Without Sony
          # credentials the app opens sign-in and waits, so still running after 20 seconds
          # means it started; a crash exits within a second or two.
          foreach ($variant in "standalone", "framework-dependent") {
            $process = Start-Process -FilePath "artifacts/$variant/BraviaTheatrePC.exe" -PassThru
            if ($process.WaitForExit(20000)) {
              throw ("The $variant executable exited during startup with code 0x{0:X8}." -f $process.ExitCode)
            }
            Stop-Process -Id $process.Id -Force
            $process.WaitForExit()
            Write-Output "The $variant executable was still running after 20 seconds."
          }
