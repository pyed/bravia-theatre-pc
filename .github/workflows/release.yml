name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, attest, and publish release
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302

      - name: Derive package version from release tag
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?)$') {
            throw "Release tag '$tag' must use the form vMAJOR.MINOR.PATCH or a valid prerelease suffix."
          }

          "RELEASE_VERSION=$($Matches.version)" >> $env:GITHUB_ENV

      - name: Restore dependencies
        run: dotnet restore BraviaTheatrePC.sln -r win-x64 -p:Version=$env:RELEASE_VERSION

      - name: Build and test
        run: dotnet test BraviaTheatrePC.sln -c Release --no-restore -warnaserror -p:Version=$env:RELEASE_VERSION

      - name: Publish standalone executable
        run: dotnet publish src/BraviaTheatre.UI/BraviaTheatre.UI.csproj -c Release -r win-x64 --self-contained --no-restore -p:Version=$env:RELEASE_VERSION -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish/standalone

      - name: Publish framework-dependent executable
        run: dotnet publish src/BraviaTheatre.UI/BraviaTheatre.UI.csproj -c Release -r win-x64 --no-self-contained --no-restore -p:Version=$env:RELEASE_VERSION -p:PublishSingleFile=true -p:DebugType=none -o publish/framework-dependent

      - name: Prepare release assets and checksums
        shell: pwsh
        run: |
          Move-Item -LiteralPath "publish/framework-dependent/BraviaTheatrePC.exe" -Destination "publish/BraviaTheatrePC-FrameworkDependent.exe"
          Move-Item -LiteralPath "publish/standalone/BraviaTheatrePC.exe" -Destination "publish/BraviaTheatrePC.exe"
          $standaloneHash = (Get-FileHash -LiteralPath "publish/BraviaTheatrePC.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $frameworkHash = (Get-FileHash -LiteralPath "publish/BraviaTheatrePC-FrameworkDependent.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "publish/BraviaTheatrePC.exe.sha256" -Value "$standaloneHash  BraviaTheatrePC.exe" -Encoding utf8NoBOM
          Set-Content -LiteralPath "publish/BraviaTheatrePC-FrameworkDependent.exe.sha256" -Value "$frameworkHash  BraviaTheatrePC-FrameworkDependent.exe" -Encoding utf8NoBOM

      - name: Attest release executables
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            publish/BraviaTheatrePC.exe
            publish/BraviaTheatrePC-FrameworkDependent.exe

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: BRAVIA Theatre PC ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            publish/BraviaTheatrePC.exe
            publish/BraviaTheatrePC.exe.sha256
            publish/BraviaTheatrePC-FrameworkDependent.exe
            publish/BraviaTheatrePC-FrameworkDependent.exe.sha256
